<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إضافة منتج جديد — Heru Admin</title>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    body { background: var(--bg-primary); color: var(--text-primary);
           font-family: var(--font-arabic); min-height: 100vh; padding: 24px; }
    .page-container { max-width: 640px; margin: 0 auto; }
    .page-header { display: flex; align-items: center; gap: 16px;
                   margin-bottom: 32px; }
    .back-btn { background: var(--bg-card); border: 1px solid var(--border);
                border-radius: var(--radius-md); padding: 8px 16px;
                color: var(--text-secondary); text-decoration: none;
                font-size: 14px; transition: all 0.2s; }
    .back-btn:hover { border-color: var(--border-accent); color: var(--accent); }
    .form-card { background: var(--bg-card); border: 1px solid var(--border);
                 border-radius: var(--radius-lg); padding: 32px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; color: var(--text-secondary);
                  font-size: 14px; margin-bottom: 8px; }
    .form-label span.required { color: #EF4444; margin-right: 4px; }
    .input-field, .select-field, .textarea-field {
      width: 100%; background: var(--bg-elevated);
      border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 12px 16px; color: var(--text-primary);
      font-family: var(--font-arabic); font-size: 15px;
      transition: border-color 0.2s; box-sizing: border-box; }
    .input-field:focus, .select-field:focus, .textarea-field:focus {
      outline: none; border-color: var(--border-accent); }
    .textarea-field { resize: vertical; min-height: 100px; }
    .toggle-group { display: flex; gap: 32px; margin-top: 8px; }
    .toggle-label { display: flex; align-items: center; gap: 10px;
                    cursor: pointer; font-size: 15px; }
    .toggle-label input[type="checkbox"] { width: 18px; height: 18px;
                                           accent-color: var(--accent); cursor: pointer; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .submit-btn { width: 100%; padding: 14px;
                  background: var(--accent); color: var(--text-inverse);
                  border: none; border-radius: var(--radius-md);
                  font-family: var(--font-arabic); font-size: 16px;
                  font-weight: 700; cursor: pointer; transition: all 0.2s;
                  margin-top: 8px; }
    .submit-btn:hover { background: var(--accent-hover); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .success-box { background: rgba(34,197,94,0.1); border: 1px solid #22C55E;
                   border-radius: var(--radius-md); padding: 20px;
                   text-align: center; display: none; }
    .error-box { background: rgba(239,68,68,0.1); border: 1px solid #EF4444;
                 border-radius: var(--radius-md); padding: 12px 16px;
                 color: #EF4444; font-size: 14px; display: none;
                 margin-bottom: 16px; }
    .section-divider { border: none; border-top: 1px solid var(--border);
                       margin: 24px 0; }
  </style>
</head>
<body>

<div class="page-container">
  
  <div class="page-header">
    <a href="/admin" class="back-btn">← العودة للأدمن</a>
    <h1 style="font-size: 22px; margin: 0;">إضافة منتج جديد</h1>
  </div>

  <div class="form-card">
    
    <div class="error-box" id="error-box"></div>
    <div class="success-box" id="success-box">
      <div style="font-size: 48px; margin-bottom: 12px;">✅</div>
      <h3 style="margin: 0 0 8px;">تم إضافة المنتج بنجاح!</h3>
      <p style="color: var(--text-secondary); margin-bottom: 20px;"
         id="success-product-name"></p>
      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
        <button onclick="resetForm()" class="submit-btn" style="width: auto; padding: 10px 24px;">
          إضافة منتج آخر
        </button>
        <a href="/admin" class="back-btn" style="padding: 10px 24px;">
          العودة للأدمن
        </a>
      </div>
    </div>

    <form id="add-product-form" novalidate>

      <!-- الاسم -->
      <div class="form-group">
        <label class="form-label">
          اسم المنتج بالعربي <span class="required">*</span>
        </label>
        <input type="text" id="name-ar" class="input-field"
               placeholder="مثال: نوت بوك شبابي A5" autocomplete="off">
      </div>

      <div class="form-group">
        <label class="form-label">اسم المنتج بالإنجليزي</label>
        <input type="text" id="name-en" class="input-field"
               placeholder="Youth Notebook A5" dir="ltr" autocomplete="off">
      </div>

      <hr class="section-divider">

      <!-- السعر والمخزون -->
      <div class="grid-2">
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label">
            السعر (جنيه) <span class="required">*</span>
          </label>
          <input type="number" id="price" class="input-field"
                 min="0" step="0.5" placeholder="0">
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label">
            الكمية المتاحة <span class="required">*</span>
          </label>
          <input type="number" id="stock" class="input-field"
                 min="0" placeholder="0">
        </div>
      </div>

      <hr class="section-divider">

      <!-- التصنيف -->
      <div class="form-group">
        <label class="form-label">التصنيف</label>
        <select id="category-id" class="select-field">
          <option value="">جارٍ التحميل...</option>
        </select>
      </div>

      <!-- الوصف -->
      <div class="form-group">
        <label class="form-label">وصف المنتج</label>
        <textarea id="description" class="textarea-field"
                  placeholder="اكتب وصفاً مختصراً للمنتج..."></textarea>
      </div>

      <hr class="section-divider">

      <!-- الصورة -->
      <div class="form-group">
        <label class="form-label">رابط صورة المنتج</label>
        <input type="url" id="image-url" class="input-field"
               placeholder="https://res.cloudinary.com/di5ihjlkh/..."
               dir="ltr">
        <small style="color: var(--text-muted); font-size: 12px;
                       display: block; margin-top: 6px;">
          ارفع الصورة على Cloudinary أولاً ثم ضع الرابط هنا
        </small>
      </div>

      <hr class="section-divider">

      <!-- الإعدادات -->
      <div class="form-group">
        <label class="form-label">إعدادات المنتج</label>
        <div class="toggle-group">
          <label class="toggle-label">
            <input type="checkbox" id="is-featured">
            <span>منتج مميز (يظهر في الصفحة الرئيسية)</span>
          </label>
          <label class="toggle-label">
            <input type="checkbox" id="is-active" checked>
            <span>نشط (مرئي للزوار)</span>
          </label>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">
        إضافة المنتج ✓
      </button>

    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ══ Initialize Supabase ══
const SUPABASE_URL = 'https://yynewmzzurjvghicerby.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5bmV3bXp6dXJqdmdoaWNlcmJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NjI2NTIsImV4cCI6MjA5MTQzODY1Mn0.vov2TwtQAOyNMJshx5YZEWms8LvXdlCQ5U7VOJU71H8';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ══ Auth Check ══
async function checkAuth() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) {
    window.location.href = '/admin/login';
    return false;
  }
  return true;
}

// ══ Load Categories ══
async function loadCategories() {
  const select = document.getElementById('category-id');
  const { data, error } = await db
    .from('categories')
    .select('id, name_ar')
    .eq('active', true)
    .order('sort_order');
  
  if (error || !data) {
    select.innerHTML = '<option value="">لا توجد تصنيفات</option>';
    return;
  }
  
  select.innerHTML = '<option value="">-- بدون تصنيف --</option>';
  data.forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat.id;
    opt.textContent = cat.name_ar;
    select.appendChild(opt);
  });
}

// ══ Form Submit ══
document.getElementById('add-product-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const nameAr = document.getElementById('name-ar').value.trim();
  const price  = parseFloat(document.getElementById('price').value);
  const stock  = parseInt(document.getElementById('stock').value);
  
  // Validation
  const errorBox = document.getElementById('error-box');
  errorBox.style.display = 'none';
  
  if (!nameAr) {
    errorBox.textContent = '⚠️ اسم المنتج بالعربي مطلوب';
    errorBox.style.display = 'block';
    document.getElementById('name-ar').focus();
    return;
  }
  if (isNaN(price) || price < 0) {
    errorBox.textContent = '⚠️ أدخل سعراً صحيحاً';
    errorBox.style.display = 'block';
    document.getElementById('price').focus();
    return;
  }
  if (isNaN(stock) || stock < 0) {
    errorBox.textContent = '⚠️ أدخل كمية صحيحة';
    errorBox.style.display = 'block';
    document.getElementById('stock').focus();
    return;
  }
  
  // Build product object
  const imageUrl = document.getElementById('image-url').value.trim();
  const categoryId = document.getElementById('category-id').value || null;
  
  const productData = {
    name_ar:        nameAr,
    name_en:        document.getElementById('name-en').value.trim() || null,
    description_ar: document.getElementById('description').value.trim() || null,
    price:          price,
    stock:          stock,
    category_id:    categoryId,
    images:         imageUrl ? [imageUrl] : [],
    featured:       document.getElementById('is-featured').checked,
    active:         document.getElementById('is-active').checked,
  };
  
  // Loading state
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'جارٍ الحفظ...';
  
  // Insert to Supabase
  const { data, error } = await db
    .from('products')
    .insert([productData])
    .select()
    .single();
  
  btn.disabled = false;
  btn.textContent = 'إضافة المنتج ✓';
  
  if (error) {
    errorBox.textContent = '❌ فشل الحفظ: ' + error.message;
    errorBox.style.display = 'block';
    return;
  }
  
  // Show success
  document.getElementById('add-product-form').style.display = 'none';
  document.getElementById('success-product-name').textContent =
    'تمت إضافة "' + nameAr + '" بنجاح';
  document.getElementById('success-box').style.display = 'block';
});

// ══ Reset form for adding another product ══
function resetForm() {
  document.getElementById('add-product-form').reset();
  document.getElementById('add-product-form').style.display = 'block';
  document.getElementById('success-box').style.display = 'none';
  document.getElementById('error-box').style.display = 'none';
  document.getElementById('is-active').checked = true;
  document.getElementById('name-ar').focus();
}

// ══ Init ══
document.addEventListener('DOMContentLoaded', async () => {
  const authed = await checkAuth();
  if (!authed) return;
  await loadCategories();
});
</script>
</body>
</html>
