<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تعديل المنتج — Heru Admin</title>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    body { background: var(--bg-primary); color: var(--text-primary);
           font-family: var(--font-arabic); min-height: 100vh; padding: 24px; }
    .page-container { max-width: 640px; margin: 0 auto; }
    .page-header { display: flex; align-items: center; justify-content: space-between; gap: 16px;
                   margin-bottom: 32px; }
    .back-btn { background: var(--bg-card); border: 1px solid var(--border);
                border-radius: var(--radius-md); padding: 8px 16px;
                color: var(--text-secondary); text-decoration: none;
                font-size: 14px; transition: all 0.2s; }
    .back-btn:hover { border-color: var(--border-accent); color: var(--accent); }
    .form-card { background: var(--bg-card); border: 1px solid var(--border);
                 border-radius: var(--radius-lg); padding: 32px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; color: var(--text-secondary);
                  font-size: 14px; margin-bottom: 8px; }
    .form-label span.required { color: #EF4444; margin-right: 4px; }
    .input-field, .select-field, .textarea-field {
      width: 100%; background: var(--bg-elevated);
      border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 12px 16px; color: var(--text-primary);
      font-family: var(--font-arabic); font-size: 15px;
      transition: border-color 0.2s; box-sizing: border-box; }
    .input-field:focus, .select-field:focus, .textarea-field:focus {
      outline: none; border-color: var(--border-accent); }
    .textarea-field { resize: vertical; min-height: 100px; }
    .toggle-group { display: flex; gap: 32px; margin-top: 8px; }
    .toggle-label { display: flex; align-items: center; gap: 10px;
                    cursor: pointer; font-size: 15px; }
    .toggle-label input[type="checkbox"] { width: 18px; height: 18px;
                                           accent-color: var(--accent); cursor: pointer; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .submit-btn { width: 100%; padding: 14px;
                  background: var(--accent); color: var(--text-inverse);
                  border: none; border-radius: var(--radius-md);
                  font-family: var(--font-arabic); font-size: 16px;
                  font-weight: 700; cursor: pointer; transition: all 0.2s;
                  margin-top: 8px; }
    .submit-btn:hover { background: var(--accent-hover); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .delete-btn { width: auto; padding: 8px 16px; margin: 0;
                  background: #EF4444; color: #fff;
                  border: none; border-radius: var(--radius-md);
                  font-family: var(--font-arabic); font-size: 14px;
                  font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .delete-btn:hover { background: #DC2626; }
    .success-box { background: rgba(34,197,94,0.1); border: 1px solid #22C55E;
                   border-radius: var(--radius-md); padding: 20px;
                   text-align: center; display: none; }
    .error-box { background: rgba(239,68,68,0.1); border: 1px solid #EF4444;
                 border-radius: var(--radius-md); padding: 12px 16px;
                 color: #EF4444; font-size: 14px; display: none;
                 margin-bottom: 16px; }
    .section-divider { border: none; border-top: 1px solid var(--border);
                       margin: 24px 0; }
    /* Dropzone CSS */
    .dropzone {
      border: 2px dashed var(--border-strong); border-radius: var(--radius-md);
      padding: 32px; text-align: center; cursor: pointer; transition: all 0.2s;
      background: var(--bg-elevated); margin-bottom: 16px;
    }
    .dropzone:hover { border-color: var(--accent); background: var(--bg-card); }
    .dropzone.dragover { border-color: var(--accent); background: rgba(34, 197, 94, 0.1); }
    
    .preview-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    }
    @media (max-width: 640px) {
      .preview-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .preview-item {
      position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden;
      border: 1px solid var(--border); background: var(--bg-card);
    }
    .preview-item img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .preview-item .delete-btn {
      position: absolute; top: 4px; right: 4px; width: 24px; height: 24px;
      border-radius: 50%; background: rgba(0,0,0,0.6); color: white;
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 16px; padding: 0; line-height: 1; margin: 0;
    }
    .preview-item .delete-btn:hover { background: #EF4444; }
    .preview-item .featured-badge {
      position: absolute; bottom: 4px; right: 4px; left: 4px;
      background: var(--accent); color: var(--text-inverse); text-align: center;
      font-size: 11px; padding: 2px 0; border-radius: 4px; font-weight: 700;
    }
    .preview-item.loading {
      display: flex; align-items: center; justify-content: center;
    }
    .loader-spinner {
      width: 24px; height: 24px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="page-container">
  
  <div class="page-header">
    <div style="display:flex; align-items:center; gap:16px;">
        <a href="/admin" class="back-btn">← العودة للأدمن</a>
        <h1 style="font-size: 22px; margin: 0;">تعديل المنتج</h1>
    </div>
    <button type="button" class="delete-btn" onclick="deleteProduct()">حذف المنتج</button>
  </div>

  <div class="form-card">
    
    <div class="error-box" id="error-box"></div>
    <div class="success-box" id="success-box">
      <div style="font-size: 48px; margin-bottom: 12px;">✅</div>
      <h3 style="margin: 0 0 8px;">تم حفظ التعديلات بنجاح!</h3>
      <p style="color: var(--text-secondary); margin-bottom: 20px;"
         id="success-product-name"></p>
      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
        <a href="/admin" class="back-btn" style="padding: 10px 24px;">
          العودة للأدمن
        </a>
      </div>
    </div>

    <form id="add-product-form" novalidate>

      <!-- الاسم -->
      <div class="form-group">
        <label class="form-label">
          اسم المنتج بالعربي <span class="required">*</span>
        </label>
        <input type="text" id="name-ar" class="input-field"
               placeholder="مثال: نوت بوك شبابي A5" autocomplete="off">
      </div>

      <div class="form-group">
        <label class="form-label">اسم المنتج بالإنجليزي</label>
        <input type="text" id="name-en" class="input-field"
               placeholder="Youth Notebook A5" dir="ltr" autocomplete="off">
      </div>

      <hr class="section-divider">

      <!-- السعر والمخزون -->
      <div class="grid-2">
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label">
            السعر (جنيه) <span class="required">*</span>
          </label>
          <input type="number" id="price" class="input-field"
                 min="0" step="0.5" placeholder="0">
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label">
            الكمية المتاحة <span class="required">*</span>
          </label>
          <input type="number" id="stock" class="input-field"
                 min="0" placeholder="0">
        </div>
      </div>

      <hr class="section-divider">

      <!-- التصنيف -->
      <div class="form-group">
        <label class="form-label">التصنيف</label>
        <select id="category-id" class="select-field">
          <option value="">جارٍ التحميل...</option>
        </select>
      </div>

      <!-- الوصف -->
      <div class="form-group">
        <label class="form-label">وصف المنتج</label>
        <textarea id="description" class="textarea-field"
                  placeholder="اكتب وصفاً مختصراً للمنتج..."></textarea>
      </div>

      <hr class="section-divider">

      <!-- الصور -->
      <div class="form-group">
        <label class="form-label">صور المنتج (حد أقصى 8)</label>
        
        <div id="image-dropzone" class="dropzone">
          <svg style="width: 32px; height: 32px; color: var(--text-muted); margin-bottom: 8px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
          <div style="color: var(--text-secondary); font-size: 14px;">اسحب الصور هنا أو اضغط للاختيار</div>
          <input type="file" id="image-input" multiple accept="image/jpeg, image/png, image/webp" style="display: none;">
        </div>

        <div id="image-error" class="error-box" style="display: none; margin-top: 12px; margin-bottom: 0;"></div>

        <div id="preview-grid" class="preview-grid">
          <!-- Previews inserted here -->
        </div>
      </div>

      <hr class="section-divider">

      <!-- الإعدادات -->
      <div class="form-group">
        <label class="form-label">إعدادات المنتج</label>
        <div class="toggle-group">
          <label class="toggle-label">
            <input type="checkbox" id="is-featured">
            <span>منتج مميز (يظهر في الصفحة الرئيسية)</span>
          </label>
          <label class="toggle-label">
            <input type="checkbox" id="is-active" checked>
            <span>نشط (مرئي للزوار)</span>
          </label>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">
        حفظ التعديلات
      </button>

    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://yynewmzzurjvghicerby.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5bmV3bXp6dXJqdmdoaWNlcmJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NjI2NTIsImV4cCI6MjA5MTQzODY1Mn0.vov2TwtQAOyNMJshx5YZEWms8LvXdlCQ5U7VOJU71H8';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentProductId = null;

async function checkAuth() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = '/admin/login'; return false; }
  return true;
}

async function loadProduct() {
  const params = new URLSearchParams(window.location.search);
  currentProductId = params.get('id');
  if (!currentProductId) { window.location.href = '/admin'; return; }
  
  const { data, error } = await db
    .from('products')
    .select('*')
    .eq('id', currentProductId)
    .single();
  
  if (error || !data) { window.location.href = '/admin'; return; }
  
  // Pre-fill form
  document.getElementById('name-ar').value    = data.name_ar || '';
  document.getElementById('name-en').value    = data.name_en || '';
  document.getElementById('description').value = data.description_ar || '';
  document.getElementById('price').value      = data.price || '';
  document.getElementById('stock').value      = data.stock || '';
  
  if (data.images && Array.isArray(data.images) && data.images.length > 0) {
      uploadedImages = [...data.images];
      updatePreviewGrid();
  }
  
  document.getElementById('is-featured').checked = data.featured || false;
  document.getElementById('is-active').checked   = data.active !== false;
  
  // Set page title
  document.querySelector('h1').textContent = 'تعديل: ' + data.name_ar;
  
  // Load categories then set selected
  await loadCategories(data.category_id);
}

async function loadCategories(selectedId = '') {
  const select = document.getElementById('category-id');
  const { data, error } = await db
    .from('categories')
    .select('id, name_ar')
    .eq('active', true)
    .order('sort_order');
  
  if (error || !data) { select.innerHTML = '<option value="">لا توجد تصنيفات</option>'; return; }
  
  select.innerHTML = '<option value="">-- بدون تصنيف --</option>';
  data.forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat.id;
    opt.textContent = cat.name_ar;
    if (cat.id === selectedId) opt.selected = true;
    select.appendChild(opt);
  });
}

document.getElementById('add-product-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const nameAr = document.getElementById('name-ar').value.trim();
  const price  = parseFloat(document.getElementById('price').value);
  const stock  = parseInt(document.getElementById('stock').value);
  const errorBox = document.getElementById('error-box');
  errorBox.style.display = 'none';
  
  if (!nameAr) { errorBox.textContent = '⚠️ اسم المنتج مطلوب'; errorBox.style.display = 'block'; return; }
  if (isNaN(price)) { errorBox.textContent = '⚠️ أدخل سعراً صحيحاً'; errorBox.style.display = 'block'; return; }
  
  const productData = {
    name_ar:        nameAr,
    name_en:        document.getElementById('name-en').value.trim() || null,
    description_ar: document.getElementById('description').value.trim() || null,
    price:          price,
    stock:          parseInt(document.getElementById('stock').value) || 0,
    category_id:    document.getElementById('category-id').value || null,
    images:         uploadedImages,
    featured:       document.getElementById('is-featured').checked,
    active:         document.getElementById('is-active').checked,
  };
  
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'جارٍ الحفظ...';
  
  const { error } = await db
    .from('products')
    .update(productData)
    .eq('id', currentProductId);
  
  btn.disabled = false;
  btn.textContent = 'حفظ التعديلات';
  
  if (error) { errorBox.textContent = '❌ فشل الحفظ: ' + error.message; errorBox.style.display = 'block'; return; }
  
  document.getElementById('add-product-form').style.display = 'none';
  document.getElementById('success-product-name').textContent = 'تم حفظ التعديلات بنجاح';
  document.getElementById('success-box').style.display = 'block';
});

async function deleteProduct() {
  if (!confirm('هل أنت متأكد من حذف هذا المنتج؟ لا يمكن التراجع عن هذا الإجراء.')) return;
  
  const { error } = await db.from('products').delete().eq('id', currentProductId);
  if (error) { alert('فشل الحذف: ' + error.message); return; }
  
  window.location.href = '/admin';
}

// ══ Multi Image Uploader ══
const CLOUDINARY_CLOUD_NAME = 'di5ihjlkh';
const CLOUDINARY_UPLOAD_PRESET = 'heru_products';

let uploadedImages = [];

const dropzone = document.getElementById('image-dropzone');
const imageInput = document.getElementById('image-input');
const previewGrid = document.getElementById('preview-grid');
const imageError = document.getElementById('image-error');

dropzone.addEventListener('click', () => imageInput.click());

dropzone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropzone.classList.add('dragover');
});

dropzone.addEventListener('dragleave', () => {
  dropzone.classList.remove('dragover');
});

dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});

imageInput.addEventListener('change', (e) => {
  handleFiles(e.target.files);
  imageInput.value = '';
});

async function handleFiles(files) {
  const newFiles = Array.from(files).filter(file => file.type.match(/image\/(jpeg|png|webp)/));
  
  if (uploadedImages.length + newFiles.length > 8) {
    imageError.textContent = 'الحد الأقصى 8 صور فقط';
    imageError.style.display = 'block';
    return;
  }
  imageError.style.display = 'none';

  for (const file of newFiles) {
    const id = Date.now() + Math.random().toString(36).substr(2, 9);
    renderPreviewStub(id);
    await uploadToCloudinary(file, id);
  }
}

async function uploadToCloudinary(file, stubId) {
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

  try {
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
      method: 'POST',
      body: formData
    });
    const data = await res.json();
    if (data.secure_url) {
      uploadedImages.push(data.secure_url);
      updatePreviewGrid();
    } else {
      throw new Error('Upload failed');
    }
  } catch (err) {
    imageError.textContent = 'حدث خطأ أثناء رفع إحدى الصور';
    imageError.style.display = 'block';
    const stub = document.getElementById(`stub-${stubId}`);
    if (stub) stub.remove();
  }
}

function renderPreviewStub(id) {
  const div = document.createElement('div');
  div.className = 'preview-item loading';
  div.id = `stub-${id}`;
  div.innerHTML = `<div class="loader-spinner"></div>`;
  previewGrid.appendChild(div);
}

function updatePreviewGrid() {
  previewGrid.innerHTML = '';
  uploadedImages.forEach((url, i) => {
    const div = document.createElement('div');
    div.className = 'preview-item';
    div.innerHTML = `
      <img src="${url}" alt="Preview">
      <button type="button" class="delete-btn" onclick="removeImage(${i})">×</button>
      ${i === 0 ? '<div class="featured-badge">رئيسية</div>' : ''}
    `;
    previewGrid.appendChild(div);
  });
}

function removeImage(index) {
  uploadedImages.splice(index, 1);
  updatePreviewGrid();
}

document.addEventListener('DOMContentLoaded', async () => {
  const authed = await checkAuth();
  if (!authed) return;
  await loadProduct();
});
</script>
</body>
</html>
