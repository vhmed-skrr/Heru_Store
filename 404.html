<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة غير موجودة | 404</title>
  
  <link rel="stylesheet" href="./assets/css/tokens.css">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  
  <style>
    .not-found-container {
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        background: var(--bg-primary);
        padding: var(--space-4);
    }
    .glitch-text {
        font-family: var(--font-display);
        font-size: 15vw;
        color: var(--accent);
        line-height: 1;
        margin: 0;
        animation: glitch 1s linear infinite;
        text-shadow: 2px 2px 0 var(--text-primary);
    }
    .msg-desc {
        font-size: var(--text-2xl);
        color: var(--text-secondary);
        margin-block-end: var(--space-8);
    }
    .action-btns {
        display: flex;
        gap: var(--space-4);
    }
  </style>
</head>
<body>
    <div class="not-found-container">
        <h1 class="glitch-text font-num">404</h1>
        <h2 class="msg-desc">الصفحة دي مش موجودة 😅</h2>
        <div class="action-btns">
            <a href="./" class="btn btn-secondary btn-lg">العودة للرئيسية</a>
            <a href="./shop" class="btn btn-primary btn-lg">تصفح المتجر</a>
        </div>
    </div>
</body>
</html>
